title: "Panta Rhei Research Program"
description: "An independent open research program dedicated to building a coherent theory of reality, published as an inspectable public research observatory. Engagement without endorsement."
url: "https://panta-rhei.site"
baseurl: ""

# Social / SEO metadata
image: /assets/og-image.png
author:
  name: "Thorsten Fuchs & Anna-Sophie Fuchs"
site_author: "Thorsten Fuchs and Anna-Sophie Fuchs"
site_authors:
  - name: "Thorsten Fuchs"
    orcid: "https://orcid.org/0009-0007-0718-1042"
  - name: "Anna-Sophie Fuchs"
    orcid: "https://orcid.org/0009-0007-3495-7416"
site_publisher: "Panta Rhei Research Program"
default_published_date: "2026-05-01T00:00:00+02:00"
default_modified_date: "2026-05-09T00:00:00+02:00"
social:
  name: "Panta Rhei Research Program"
  links:
    - "https://github.com/Panta-Rhei-Research/taulib"

# Search Console verification tokens
# - Bing: already embedded in _includes/head.html (msvalidate.01)
# - Google: populate this key with the token from Google Search Console when registered
# - Yandex: populate this key if registering with Yandex Webmaster
google_site_verification: ""
yandex_verification: ""

permalink: pretty

# Buttondown newsletter integration
buttondown:
  username: "panta-rhei-research"
  form_action: "https://buttondown.com/api/emails/embed-subscribe/panta-rhei-research"
  default_tag: "research-notes"
  heading: "Receive Publication Notifications"
  body: "Get new Panta Rhei publication releases by email. Notifications are sent irregularly and only when there is something substantial to say."
  privacy_note: "Subscription is handled by Buttondown with confirmation by email (double opt-in). You can unsubscribe at any time."
  button_label: "Subscribe"

collections:
  bibliography:
    output: true
    permalink: /bibliography/:name/
  research_notes:
    output: true
    permalink: /publications/research-notes/:name/
    sort_by: date
  changelog:
    output: true
    permalink: /changelog/:name/
    sort_by: date
  corpus_changelog:
    output: true
    permalink: /corpus/changelog/:name/
    sort_by: date
  corpus_v3_items:
    output: true
    permalink: /id/:name/
  predictions:
    output: true
    permalink: /predictions/:name/
  falsifications:
    output: true
    permalink: /falsifications/:name/
  core_semantics:
    output: true
    permalink: /agenda/core-semantics/:path/

collections_dir: .

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap

include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - specs
  - scripts
  - README.md
  - .DS_Store
  - _taulib_docs

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "research-program"
    values:
      layout: "program-doc"
      lane: "research-program"
      v2_lane: "program"
      type: "Compatibility Route"
      status: "Compatibility"
  - scope:
      path: "research-notes"
    values:
      layout: "redirect"
      lane: "publications"
      v2_lane: "publications"
      type: "Compatibility Route"
      status: "Compatibility"
  - scope:
      path: "brand"
    values:
      lane: "utility"
      v2_lane: "support"
      type: "Support Page"
      status: "Canonical"
  - scope:
      path: "verify/assessments"
    values:
      lane: "verify"
      v2_lane: "verify"
      type: "Assessment Protocol"
      status: "Canonical"
  - scope:
      type: "bibliography"
    values:
      layout: "bibliography-entry"
      lane: "bibliography"
  - scope:
      type: "research_notes"
    values:
      layout: "research-note"
      lane: "publications"
      v2_lane: "publications"
  - scope:
      type: "changelog"
    values:
      layout: "changelog-entry"
      lane: "utility"
  - scope:
      type: "predictions"
    values:
      layout: "prediction-page"
      lane: "results"
      v2_lane: "results"
      type: "Prediction"
      status: "Canonical"
      source_path: "corpus/results/facets/predictions"
  - scope:
      type: "falsifications"
    values:
      layout: "falsification-page"
      lane: "results"
      v2_lane: "results"
      type: "Falsification Path"
      status: "Canonical"
      source_path: "corpus/results/facets/falsifications"
  - scope:
      type: "core_semantics"
    values:
      layout: "recovery-requirement-item"
      lane: "program"
      v2_lane: "program"
