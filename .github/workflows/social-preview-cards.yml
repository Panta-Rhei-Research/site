name: Build Social Preview Cards

# The generated OpenGraph card layer is intentionally outside the normal Pages
# build. It is a reviewable asset pass, not part of the editorial critical path.

on:
  workflow_dispatch:
    inputs:
      card_mode:
        description: "Generate SVG-only cards or SVG + PNG cards"
        required: true
        default: "png"
        type: choice
        options:
          - png
          - svg

permissions:
  contents: read

jobs:
  build-social-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install SVG rasterizer
        if: inputs.card_mode == 'png'
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Build site with social-preview cards
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
          PANTA_RHEI_GENERATE_OG_CARDS: "1"
          PANTA_RHEI_OG_CARD_MODE: ${{ inputs.card_mode }}

      - name: Upload social-preview cards
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-cards-${{ inputs.card_mode }}
          path: _site/assets/og-cards/
          retention-days: 14

      - name: Summarize generated cards
        run: |
          {
            echo "## Social preview cards"
            echo
            echo "- Mode: \`${{ inputs.card_mode }}\`"
            echo "- SVG files: \`$(find _site/assets/og-cards -name '*.svg' | wc -l | tr -d ' ')\`"
            echo "- PNG files: \`$(find _site/assets/og-cards -name '*.png' | wc -l | tr -d ' ')\`"
            echo
            echo "Download the artifact above for visual review before adopting any generated cards."
          } >> "$GITHUB_STEP_SUMMARY"
