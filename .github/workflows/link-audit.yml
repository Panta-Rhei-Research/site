name: Periodic Link Audit

# ============================================================
# Periodic dead-link audit for panta-rhei.site
# ============================================================
# Replacement for the in-PR html-proofer that was disabled on the
# critical path on 2026-05-01 (perf concerns: ~90s on the full
# ~9,675-page site, often blocked behind `concurrency: pages`).
#
# This workflow runs the same audit on a schedule + on-demand,
# so dead-link regressions are surfaced without slowing every PR.
#
# Triggers:
#   - schedule: nightly at 02:00 UTC (low-traffic window)
#   - workflow_dispatch: on-demand manual run
#
# It does NOT block merges; it surfaces an issue for triage instead.
# ============================================================

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          PANTA_RHEI_GENERATE_OG_CARDS: "0"

      - name: Build Pagefind index
        run: npm run pagefind

      - name: Run link audit
        id: link_audit
        run: |
          chmod +x .github/scripts/link-check.sh
          if .github/scripts/link-check.sh _site 2>&1 | tee link-audit.log; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=broken" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-audit-log
          path: link-audit.log
          retention-days: 30

      - name: Open issue on regression
        if: steps.link_audit.outputs.status == 'broken' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('link-audit.log', 'utf8');
            // Truncate log to first 6000 chars to keep the issue body readable
            const excerpt = log.length > 6000
              ? log.slice(0, 6000) + '\n\n…(truncated; see workflow artifact for full log)'
              : log;
            const today = new Date().toISOString().slice(0, 10);
            const title = `Link audit: broken internal links detected (${today})`;
            const body = [
              `The nightly link audit at \`${context.runId}\` detected broken internal links on \`main\`.`,
              ``,
              `**Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `**Trigger:** \`${context.eventName}\` (scheduled)`,
              ``,
              `### Audit log (excerpt)`,
              ``,
              '```',
              excerpt,
              '```',
              ``,
              `Full log attached as workflow artifact \`link-audit-log\` (30-day retention).`,
            ].join('\n');
            // Look for an existing open issue to update instead of opening a new one
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-audit-regression',
              per_page: 10,
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Audit ${today} also detected broken links.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['link-audit-regression'],
              });
            }

      - name: Fail workflow if links broken (manual run)
        if: steps.link_audit.outputs.status == 'broken' && github.event_name == 'workflow_dispatch'
        run: |
          echo "::error::Link audit found broken internal links — see audit log artifact"
          exit 1
