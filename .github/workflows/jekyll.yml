name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate edge headers Worker
        run: |
          npm run headers:test
          npm run headers:dry-run

      - name: Install Python QA dependencies
        run: python3 -m pip install PyYAML

      - name: Check manifest-owned release metrics
        run: |
          python3 scripts/check_release_manifest_parity.py --site-root .
          python3 scripts/check_hardcoded_release_numbers.py .

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
          PANTA_RHEI_GENERATE_OG_CARDS: "0"

      - name: Check social previews are separated from normal build
        run: python3 scripts/assert_social_preview_separation.py _site

      - name: Check production OG/Twitter card pipeline
        run: python3 scripts/assert_og_pipeline.py _site

      - name: Check Site Atlas gates
        run: |
          python3 scripts/check_site_atlas_meta.py _site
          python3 scripts/check_site_atlas_visible_terms.py _site
          python3 scripts/check_site_atlas_collection_counts.py _site
          python3 scripts/check_site_atlas_routes.py _site

      - name: Check v2 shell migration
        run: npm run qa:v2-shell

      - name: Build Pagefind search index
        run: npm exec -- pagefind --site _site --output-subdir pagefind

      # ── Smoke-test the built artifact ──────────────────────
      # Validates _site/ has every expected asset, body marker,
      # and anti-regression string BEFORE it's uploaded/deployed.
      # No CDN involvement — runs against local files in ~2s.
      # Fails the build visibly if anything regressed.
      - name: Smoke-test build artifact
        run: |
          chmod +x .github/scripts/smoke-test.sh
          .github/scripts/smoke-test.sh _site

      # ── Dead-link audit (off the PR critical path) ─────────
      # The html-proofer dead-link audit was removed from this
      # workflow on 2026-05-01: it ran ~90s on the full ~9,675-
      # page site and added 1.5–2 minutes to every PR's critical
      # path on top of the Jekyll build (often blocked behind
      # the `concurrency: pages` queue).
      #
      # Replacement: `link-audit.yml` runs the same audit nightly
      # at 02:00 UTC and on workflow_dispatch. It opens (or
      # comments on) an issue labeled `link-audit-regression`
      # when broken internal links are detected. The script lives
      # at `.github/scripts/link-check.sh` and can be invoked
      # locally against `_site/` via `.github/scripts/link-check.sh
      # _site`. To re-enable on every PR, uncomment the block
      # below — but expect the latency cost.
      #
      # - name: Dead-link audit
      #   run: |
      #     chmod +x .github/scripts/link-check.sh
      #     .github/scripts/link-check.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
