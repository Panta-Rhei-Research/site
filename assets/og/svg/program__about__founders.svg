<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Panta Rhei preview card for Founders.">
  <defs>
    <style>
      @font-face { font-family: "EB Garamond OG"; src: url("../fonts-local/EBGaramond-Regular.ttf"); }
      @font-face { font-family: "Source Sans 3 OG"; src: url("../fonts-local/SourceSans3-Regular.ttf"); }
      @font-face { font-family: "Source Code Pro OG"; src: url("../fonts-local/SourceCodePro-Regular.ttf"); }
    </style>
    <linearGradient id="spectrum-rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A7EB3"/><stop offset="34%" stop-color="#1B8278"/><stop offset="68%" stop-color="#9F5B5C"/><stop offset="100%" stop-color="#896092"/>
    </linearGradient>
    <linearGradient id="panta-og-dark-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13395E"/><stop offset="48%" stop-color="#163E64"/><stop offset="100%" stop-color="#1A4874"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#panta-og-dark-gradient)"/>
  <rect x="0" y="618" width="1200" height="12" fill="url(#spectrum-rule)"/>

  <!-- Faint Lucide fox-face-tail icon, decorative right-side accent -->
  <svg x="835" y="220" width="300" height="300" viewBox="0 0 24 24" opacity="0.20" aria-hidden="true">
    <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.9 8.3C20.6 7 21 5.6 21 4c0-.6-.4-1-1-1-2.3 0-4.3.8-5.9 2.2a14.92 14.92 0 0 0-4.2 0A8.78 8.78 0 0 0 4 3c-.6 0-1 .4-1 1 0 1.6.4 3 1.1 4.3-.6.7-1.1 1.4-1.4 2.2C4 13 11 16 12 16s8-3 9.3-5.5c-.3-.8-.8-1.5-1.4-2.2"/>
      <path d="M9 9v.5"/>
      <path d="M13 13h-2"/>
      <path d="M12 16v-3"/>
      <path d="M15 9v.5"/>
      <path d="M6.3 20.5A6.87 6.87 0 0 0 9 15H2.2c.8 4 4.9 7 9.8 7 5.5 0 10-3.8 10-8.5 0-1.1-.2-2.1-.7-3"/>
    </g>
  </svg>

  <!-- π ρ wordmark + program name, top-right -->
  <g transform="translate(785 26)" fill="#F8FAF7">
    <text x="0" y="44" font-family="EB Garamond OG, Georgia, serif" font-size="52" font-weight="400">π</text>
    <text x="31" y="67" font-family="EB Garamond OG, Georgia, serif" font-size="52" font-style="italic" font-weight="400">ρ</text>
    <text x="86" y="36" font-family="Source Sans 3 OG, Inter, Arial, sans-serif" font-size="25" font-weight="700">Panta Rhei Research</text>
    <text x="86" y="67" font-family="Source Sans 3 OG, Inter, Arial, sans-serif" font-size="21" opacity="0.82">Independent open research program</text>
  </g>

  <!-- Eyebrow pill, top-left -->
  <g transform="translate(70 76)">
    <rect width="320" height="44" rx="22" fill="#F8FAF7" opacity="0.96"/>
    <text x="18" y="29" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="19" font-weight="700" letter-spacing="1.8" fill="#163E64">PROGRAM · ABOUT · FOUNDERS</text>
  </g>

  <!-- Main title -->
  <text font-family="EB Garamond OG, Georgia, serif" font-size="124" font-weight="400" fill="#F8FAF7">
    <tspan x="78" y="260">Founders</tspan>
  </text>

  <!-- Subtitle -->
  <text font-family="Source Sans 3 OG, Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#D8E3EC">
    <tspan x="82" y="380">Anna-Sophie Fuchs and Thorsten Fuchs.</tspan>
    <tspan x="82" y="424">An independent open research program,</tspan>
    <tspan x="82" y="468">published as an inspectable public observatory.</tspan>
  </text>

  <!-- Route line at bottom -->
  <text x="82" y="568" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="30" font-weight="500" fill="#B9CFE2">panta-rhei.site/program/about/founders</text>
</svg>
