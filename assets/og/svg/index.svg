<?xml version="1.0" encoding="UTF-8"?>
<!-- @custom-data-carrying · AUD-23 homepage OG card · do not regenerate -->
<!-- ============================================================
     Panta Rhei Research Program — homepage OG card (data-carrying).

     Per atlas/website/briefings/v5/design_handoff_audit_AUD-2026-05-19/
     README.md §AUD-23, the homepage OG card carries content, not a
     generic logo plate. The five layout regions:

       1. Stacked lockup top-left  (πρ glyph + wordmark caption)
       2. Release stamp top-right  (v4 · 2 May 2026 · manifest 07ea80a)
       3. Master constant centre   (ιτ = 2/(π + e)  ≈ 0.341 304)
       4. TauLib data row          (512 · 4,863 · 0 · 3 with mono labels)
       5. τ-spectrum seal bottom   (4-px continuous spectral hairline)

     The card is generated once and pinned. It is regenerated only by
     editing this file directly — the OG batch generator preserves it
     because of the @custom-data-carrying sentinel on line 2.

     Tokens used (must match _sass/_variables.scss):
       panta-blue-900 #0B2238  (dark surface gradient anchor)
       panta-blue-700 #163E64  (mid)
       panta-blue-800 #123657  (highlight)
       paper-50       #FAFAF7  (text)
       accent-gold    #A8792A  (0-sorry cell · the strongest claim)
       tau-spectrum-rule       E0 to E3 (4px footer rule)

     Numbers are doctrine-pinned to the public release manifest. Edit
     them only as part of a manifest bump — never in isolation.
============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630"
     viewBox="0 0 1200 630"
     role="img"
     aria-label="Panta Rhei Research Program — v4 release · master constant ι-tau equals 2 over (pi plus e), approximately 0.341 304 · TauLib 512 Lean 4 modules, 4,863 theorems and lemmas, zero sorry assignments, three custom axioms · public research observatory.">
  <defs>
    <style>
      @font-face { font-family: "EB Garamond OG"; src: url("../fonts-local/EBGaramond-Regular.ttf"); }
      @font-face { font-family: "Source Sans 3 OG"; src: url("../fonts-local/SourceSans3-Regular.ttf"); }
      @font-face { font-family: "Source Code Pro OG"; src: url("../fonts-local/SourceCodePro-Regular.ttf"); }
    </style>
    <linearGradient id="panta-og-dark-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#0B2238"/>
      <stop offset="48%" stop-color="#123657"/>
      <stop offset="100%" stop-color="#1A4874"/>
    </linearGradient>
    <linearGradient id="spectrum-rule" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5A7EB3"/>
      <stop offset="34%"  stop-color="#1B8278"/>
      <stop offset="68%"  stop-color="#9F5B5C"/>
      <stop offset="100%" stop-color="#896092"/>
    </linearGradient>
  </defs>

  <!-- Dark substrate -->
  <rect width="1200" height="630" fill="url(#panta-og-dark-gradient)"/>

  <!-- 1 · Stacked lockup (top-left) -->
  <g font-family="EB Garamond OG, Georgia, serif" fill="#F8FAF7">
    <text x="64" y="120" font-size="84" font-style="italic" font-weight="400" letter-spacing="-1">πρ</text>
    <text x="146" y="92"  font-size="26" font-weight="400" letter-spacing="0.5">Panta&#160;Rhei</text>
    <text x="146" y="124" font-size="22" font-weight="400" letter-spacing="0.3" fill-opacity="0.84">Research Program</text>
  </g>
  <text x="64" y="160"
        font-family="Source Code Pro OG, ui-monospace, monospace"
        font-size="14" font-weight="700" letter-spacing="3.6"
        fill="#F8FAF7" fill-opacity="0.68">
    PUBLIC&#160;RESEARCH&#160;OBSERVATORY
  </text>

  <!-- 2 · Release stamp (top-right) -->
  <text x="1136" y="92"
        font-family="Source Code Pro OG, ui-monospace, monospace"
        font-size="14" font-weight="500" letter-spacing="2.4"
        text-anchor="end"
        fill="#F8FAF7" fill-opacity="0.72">
    V4.0&#160;·&#160;2&#160;MAY&#160;2026&#160;·&#160;MANIFEST&#160;07EA80A
  </text>

  <!-- 3 · Master constant ιτ (centre) -->
  <text x="600" y="306"
        font-family="EB Garamond OG, Georgia, serif"
        font-size="96" font-style="italic" font-weight="500"
        letter-spacing="-1.5"
        text-anchor="middle"
        fill="#FFFFFF">
    ιτ&#160;=&#160;2&#160;/&#160;(π&#160;+&#160;e)
  </text>
  <text x="600" y="372"
        font-family="EB Garamond OG, Georgia, serif"
        font-size="48" font-weight="400" letter-spacing="1.0"
        text-anchor="middle"
        fill="#F8FAF7" fill-opacity="0.85">
    ≈&#160;0.341&#8201;304
  </text>
  <text x="600" y="410"
        font-family="Source Code Pro OG, ui-monospace, monospace"
        font-size="13" font-weight="500" letter-spacing="2.4"
        text-anchor="middle"
        fill="#F8FAF7" fill-opacity="0.6">
    MASTER&#160;CONSTANT&#160;·&#160;FOUNDATIONAL&#160;HINGE&#160;H3
  </text>

  <!-- 4 · TauLib data row -->
  <line x1="80" y1="468" x2="1120" y2="468" stroke="#F8FAF7" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="80" y1="568" x2="1120" y2="568" stroke="#F8FAF7" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Cell 1 · Lean modules -->
  <g text-anchor="middle">
    <text x="220" y="528" font-family="EB Garamond OG, Georgia, serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#FFFFFF">512</text>
    <text x="220" y="552" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.0" fill="#F8FAF7" fill-opacity="0.6">LEAN&#160;4&#160;MODULES</text>
  </g>
  <line x1="360" y1="478" x2="360" y2="558" stroke="#F8FAF7" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Cell 2 · Theorems & lemmas -->
  <g text-anchor="middle">
    <text x="490" y="528" font-family="EB Garamond OG, Georgia, serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#FFFFFF">4,863</text>
    <text x="490" y="552" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.0" fill="#F8FAF7" fill-opacity="0.6">THEOREMS&#160;&amp;&#160;LEMMAS</text>
  </g>
  <line x1="630" y1="478" x2="630" y2="558" stroke="#F8FAF7" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Cell 3 · Sorry budget — GOLD inflection -->
  <rect x="640" y="478" width="280" height="80" fill="#A8792A" fill-opacity="0.18" rx="4"/>
  <g text-anchor="middle">
    <text x="780" y="528" font-family="EB Garamond OG, Georgia, serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#FFE9B5">0</text>
    <text x="780" y="552" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.0" fill="#FFE9B5" fill-opacity="0.9">SORRY&#160;BUDGET</text>
  </g>
  <line x1="930" y1="478" x2="930" y2="558" stroke="#F8FAF7" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Cell 4 · Custom axioms · Book III -->
  <g text-anchor="middle">
    <text x="1040" y="528" font-family="EB Garamond OG, Georgia, serif" font-size="56" font-weight="500" letter-spacing="-1.5" fill="#FFFFFF">3</text>
    <text x="1040" y="552" font-family="Source Code Pro OG, ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.0" fill="#F8FAF7" fill-opacity="0.6">CUSTOM&#160;AXIOMS&#160;·&#160;BOOK&#160;III</text>
  </g>

  <!-- Site URL line above τ-seal -->
  <text x="600" y="608"
        font-family="Source Code Pro OG, ui-monospace, monospace"
        font-size="13" font-weight="500" letter-spacing="2.6"
        text-anchor="middle"
        fill="#F8FAF7" fill-opacity="0.42">
    PANTA-RHEI.SITE
  </text>

  <!-- 5 · τ-spectrum seal (bottom edge) -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#spectrum-rule)" opacity="0.9"/>
</svg>
