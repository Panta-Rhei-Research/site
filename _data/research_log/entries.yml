# Research Progress Log — entries manifest.
#
# Source: atlas/website/v5/panta-rhei-ia-doctrine-v5.md §4.4 ("Entry schema").
# Roadmap: atlas/website/briefings/v5/v5-next-wave-roadmap-2026-05-23/
#          README.md (W5 · Research Log).
#
# Entries are appended in chronological order (oldest first). The
# /research-log/ page reverses the list for display so newest entries
# appear at the top.
#
# Schema per IA §4.4:
#
#   id: rlog-YYYY-MM-DD-NNN      # stable handle, never reused
#   date: YYYY-MM-DD              # ISO 8601 date (date the event occurred,
#                                 # not the date the entry was written)
#   type: publication | registry | taulib | result-status | pre-registration
#         | falsification | erratum | release | website
#   status: recorded | updated | superseded | corrected
#   title: "Short noun phrase, sentence case"
#   summary: "1-3 sentences. Operational, not promotional."
#   linked_artifacts:                       # 0..N items
#     - title: "Artifact display name"
#       url: "/canonical/path/"
#   related_lanes:                          # 0..N entries from the 8 lanes
#     - <lane>
#
# Per IA §4.5 the log records active research stream events — distinct
# from /changelog/ (site / release / infrastructure changes) and from
# /corpus-changelog/ (semantic corpus corrections + bridge revisions).
# When in doubt: if the event would interest a reviewer or journalist
# tracking the research's progress, it belongs here. If it only
# interests someone tracking the website's release engineering, it
# belongs in /changelog/.
#
# Initial backfill: roughly the last thirty days of research-stream
# activity (2026-04-25 through 2026-05-23). Subsequent entries are
# appended as events occur.

