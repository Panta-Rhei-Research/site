schema_version: 1
description: >
  Curated overrides for the v4 OG/Twitter card production pipeline. The
  generator also includes every Site Atlas launch-critical page.

defaults:
  template: og-dark-standard
  variant: dark

pages:
  - route: /
    icon: explore
    eyebrow: "PUBLIC RESEARCH OBSERVATORY"
    subtitle: "An independent open research program dedicated to building a coherent theory of reality."
  - route: /program/
    icon: account_balance
    eyebrow: "PROGRAM · IDENTITY"
    subtitle: "Identity, doctrine, scope, status, founders, and scrutiny posture."
  - route: /agenda/
    icon: checklist
    eyebrow: "AGENDA · OBLIGATIONS"
    subtitle: "What must be asked, recovered, built, refused, answered, and left open."
  - route: /corpus/
    icon: deployed_code
    eyebrow: "CORPUS · CONSTRUCTION"
    subtitle: "The construction body of the theory: spine, registry, TauLib, monographs, and graph."
  - route: /results/
    icon: inventory_2
    eyebrow: "RESULTS · CONSEQUENCES"
    subtitle: "Where the built Corpus becomes a world, with status-marked consequences routed to inspection."
  - route: /verify/
    icon: fact_check
    eyebrow: "VERIFY · INSPECTION"
    subtitle: "Where building becomes accountable through formal, empirical, bridge, and review checks."
  - route: /publications/
    icon: library_books
    eyebrow: "PUBLICATIONS · ARTIFACTS"
    variant: light
    template: og-light-standard
    subtitle: "Stable released research artifacts, downloads, citations, errata, and archive policy."
  - route: /impact/
    icon: public
    eyebrow: "IMPACT · CONDITIONAL RELEVANCE"
    subtitle: "What could matter if the work survives inspection, translation, and uptake."
  - route: /engage/
    icon: handshake
    eyebrow: "ENGAGE · OPEN SCRUTINY"
    subtitle: "How openness becomes operational without implying endorsement."

  - route: /publications/anchor-documents/
    icon: history_edu
    variant: light
    template: og-light-standard
    subtitle: "Citable v4 anchor documents for first-contact readers, reviewers, and institutional audiences."
  - route: /publications/anchor-documents/wp000-panta-rhei-at-a-glance/
    icon: explore
    variant: light
    template: og-light-standard
    title: "WP000 · Panta Rhei at a Glance"
    subtitle: "A four-page first-contact primer for reading Panta Rhei as an inspectable public research object."
  - route: /publications/anchor-documents/c001-standing-in-the-inquiry-of-being/
    icon: history_edu
    variant: light
    template: og-light-standard
    title: "C001 · Standing in the Inquiry of Being"
    subtitle: "The program charter essay behind the public doctrine surface."
  - route: /publications/anchor-documents/wp001-panta-rhei-research-program-executive-overview/
    icon: account_balance
    variant: light
    template: og-light-standard
    title: "WP001 · Executive Overview"
    subtitle: "A compact executive orientation to the Panta Rhei Research Program."
  - route: /publications/anchor-documents/wp002-t-theory-executive-synopsis/
    icon: deployed_code
    variant: light
    template: og-light-standard
    title: "WP002 · T-Theory Executive Synopsis"
    subtitle: "The theory-side synopsis for readers entering through construction."
  - route: /publications/anchor-documents/wp003-taulib-technical-overview/
    icon: code
    variant: light
    template: og-light-standard
    title: "WP003 · TauLib Technical Overview"
    subtitle: "A technical map of the formal library and proof-checking surface."
  - route: /publications/anchor-documents/wp004-public-research-observatory-blueprint/
    icon: hub
    variant: light
    template: og-light-standard
    title: "WP004 · Public Research Observatory Blueprint"
    subtitle: "The operational blueprint for public inspection and release governance."
  - route: /publications/anchor-documents/wp005-global-public-good-impact-overview/
    icon: public
    variant: light
    template: og-light-standard
    title: "WP005 · Global Public Good Impact Overview"
    subtitle: "Conditional public-good relevance downstream of verification, translation, and uptake."

  # Pages outside the launch-critical set that nevertheless need a generated
  # OG card because their frontmatter sets og_image to a /assets/og/png/ path.
  # Without these overrides, the generator skips them and the override target
  # 404s.
  - route: /program/about/founders/
    icon: groups
    eyebrow: "PROGRAM · FOUNDERS"
    title: "Founders"
    subtitle: "Independent program by Dr. Thorsten Fuchs and Anna-Sophie Fuchs."
  - route: /verify/predictions-and-falsification/predictions/
    icon: track_changes
    eyebrow: "VERIFY · PREDICTIONS"
    title: "Predictions and Falsification"
    subtitle: "Pre-registered, status-labeled predictions with inspection routes and falsification handles."

  # /media/ sub-pages — newsroom briefs, FAQ, and press kits. The /media/ hub
  # has a generated card via the launch-critical set, but its six sub-pages
  # were falling back to the site-wide /assets/og-image.png. Give each its
  # own dedicated card so the press surface looks intentional when shared.
  - route: /media/open-research-brief/
    icon: description
    eyebrow: "MEDIA · PRESS BRIEF"
    title: "Open Research Brief"
    subtitle: "A newsroom-length brief for the first safe story: inspection architecture before belief."
  - route: /media/theory-of-reality-brief/
    icon: description
    eyebrow: "MEDIA · PRESS BRIEF"
    title: "Theory of Reality Brief"
    subtitle: "A newsroom brief explaining why Panta Rhei says coherent theory of reality, not theory of everything."
  - route: /media/public-research-observatory-brief/
    icon: description
    eyebrow: "MEDIA · PRESS BRIEF"
    title: "Public Research Observatory Brief"
    subtitle: "A newsroom brief for how panta-rhei.site implements a public research observatory."
  - route: /media/journalist-faq/
    icon: forum
    eyebrow: "MEDIA · PRESS FAQ"
    title: "Journalist FAQ"
    subtitle: "Press FAQ — peer review, funding, citation, interviews, embargo policy."
  - route: /media/social-media-kit/
    icon: note_stack
    eyebrow: "MEDIA · SOCIAL KIT"
    title: "Social Media Kit"
    subtitle: "Suggested posts, hashtags, and share cards for journalists and supporters."
  - route: /media/story-angles/
    icon: article
    eyebrow: "MEDIA · STORY ANGLES"
    title: "Story Angles for Journalists"
    subtitle: "Five framings for journalists, with headlines, ledes, and key-fact anchors."
