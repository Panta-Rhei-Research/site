    2026 pairwise-kSZ constraint: Category τ rejects both a new dark-matter particle
    and a fundamental MOND transition at the tested scale, while committing to a Newtonian
    inverse-square force-law exponent in the cluster-pair regime. The note defines
    falsification surfaces and reporting targets rather than claiming external acceptance.'
