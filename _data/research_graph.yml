# Local research graph manifest — v5 next-wave doctrine, IA §15.
#
# Source doctrine: atlas/website/v5/panta-rhei-ia-doctrine-v5.md §10, §11, §15.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for the website's identity /
# authority graph. It drives:
#
#   - JSON-LD generation (Wave 6b)
#   - Right-rail identifier boxes (Wave 6b)
#   - The /research-graph/ public page (Wave 6a)
#   - Citation snippets (existing /cite/ page + future enhancements)
#   - Release-manifest provenance links (Wave 8a)
#
# Three surfaces consume this manifest. They must never diverge — the
# manifest is canonical. If a value is unknown, leave it as `null` (not
# absent) so consumers can distinguish "unknown" from "field missing".
#
# Doctrine on Wikidata:
#   Per founders' decision (roadmap §2.3), Wikidata QID creation is
#   DEFERRED to a follow-up cycle. All `wikidata_qid:` fields in this
#   file are `null` at v5 next-wave ship. The manifest infrastructure
#   IS in place; QIDs will be added once the Wikidata notability +
#   sourcing review completes.
#
# Doctrine on local IDs (IA §10.5):
#   Local IDs follow the pattern:
#     prrp:program:<slug>
#     prrp:person:<slug>
#     prrp:publication:<slug>
#     prrp:software:<slug>
#     prrp:page:<slug>
#     prrp:registry:item:<id>
#
# Schema for each entity:
#   id              local prrp:* ID (required)
#   type            research_program | person | research_monograph |
#                   research_paper | research_note | research_dossier |
#                   research_code | software_repository | website
#   label           display name (required)
#   url             primary site route (required for visible entities)
#   wikidata_qid    Wikidata Q-number (null until follow-up cycle)
#   doi             DOI string (null if none)
#   osf             OSF project/page URL (null if none)
#   github_repo     GitHub repo URL (null if none)
#   arxiv           arXiv URL (null if none)
#   orcid           ORCID URL (persons only)
#   same_as         []string — additional sameAs URLs
#   authors         []string — local IDs of author persons
#   is_part_of      []string — local IDs of parent entities
#   related         []string — local IDs of related entities
#   citation_status see _data/release_lines.yml citation_status
#   release_line    see _data/release_lines.yml corpus_release_lines
#   notes           free-form clarifier (optional)

