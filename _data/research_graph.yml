# ─── 9 · Authority-layer notes ────────────────────────────────────
#
# This block is documentation, not graph entities. It records the
# canonical external authority layers the program uses.

authority_layers:
  active:
    - name: OSF
      url: https://osf.io/
      role: project-page + DOI minting
    - name: GitHub
      url: https://github.com/Panta-Rhei-Research
      role: source code, release artifacts, audit scripts
    - name: arXiv
      url: https://arxiv.org/
      role: preprint posting (when applicable)
    - name: ORCID
      url: https://orcid.org/
      role: author identity authority
    - name: DOI
      url: https://www.doi.org/
      role: artifact persistent identifier
    - name: Wikidata
      url: https://www.wikidata.org/
      role: authority graph (deferred — see roadmap §2.3)

  deprecated:
    - name: Zenodo
      role: >
        Deprecated as active repository per IA §5.3. Historical DOIs
        on the Second Edition monographs remain resolvable; future
        artifacts use OSF DOIs. Single deprecation note lives in the
        Research Graph's correction-history section.
