- cluster_id: pa000003
  cluster_key: foundations_and_logic
  title: Foundations and Logic
  summary: Bibliography domain cluster for Foundations and Logic.
  description: >-
    The largest cluster in the corpus (492 entries) — covers classical
    mathematical analysis (Ahlfors, Rudin, Hörmander), modern type theory and
    transcendental syntax (Girard, Eng, Altenkirch–Kaposi), Gödel-limitation
    discussions (Willard self-verifying systems, the categorical Gödel
    treatments), and a substantial body of philosophical and physical
    foundations literature that touches the program's logical core (Hume, Kant,
    Schrödinger's "What is Life?"). The program's Foundations & Logic
    challenges (F1–F18) — categoricity, Gödel-avoidance, internal logic,
    paraconsistency, set-theoretic strength — engage this cluster directly. Some
    Physics and Topology entries appear here due to existing classification
    quirks; cluster taxonomy refinement is on the editorial backlog.
