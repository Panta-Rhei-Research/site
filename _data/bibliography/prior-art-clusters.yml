- cluster_id: pa000002
  cluster_key: computation_and_complexity
  title: Computation and Complexity
  summary: Bibliography domain cluster for Computation and Complexity.
  description: >-
    Classical complexity theory, computability, and the foundational catalogue
    of NP-complete problems. The cluster is intentionally small in the corpus —
    the program engages computation primarily via the τ-Tower Machine internal
    model and the τ-internal P=NP collapse theorem, which is explicitly NOT a
    resolution of the Clay P vs NP problem in the standard Turing-machine model
    (see Red-team FAQ #4). Reviewers wanting to interrogate the τ-internal
    computational substrate against the Cook–Levin / Karp / Garey–Johnson
    lineage should use this cluster as their bibliography starting point.
