- cluster_id: pa000008
  cluster_key: topology_and_geometry
  title: Topology and Geometry
  summary: Bibliography domain cluster for Topology and Geometry.
  description: >-
    Algebraic geometry (Hartshorne, Griffiths–Harris, Voisin), complex geometry
    (Huybrechts, Ahlfors's conformal-invariants treatment), several-complex-
    variables analysis relevant to the τ-Holomorphy and Hartogs-extension
    machinery in Book I (Grauert, Hörmander, Gunning–Rossi), and index theory
    (Atiyah–Singer, Atiyah–Bott). The cluster grounds the program's
    "Global Hartogs" claim on the split-complex boundary algebra ℋ[j] (which
    requires careful treatment given zero divisors — see Pure Mathematics
    expert-domain dossier). Reviewers should compare the τ-CR operator and
    Hartogs-style extension on 𝕃 against the classical multi-variable
    holomorphy literature.
