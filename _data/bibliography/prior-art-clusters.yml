  title: Physics
  summary: Bibliography domain cluster for Physics.
  description: >-
    The largest physics-side cluster (199 entries) covering general relativity
    (Einstein 1915 field equations, Schwarzschild, Kerr), observational cosmology
    (Hubble, Perlmutter, Planck Collaboration, BICEP/Keck), gravitational waves
    (LIGO 2016), Event Horizon Telescope, and Standard-Model particle physics
    (Glashow, Weinberg, Salam, Gross–Wilczek). The cluster grounds Book IV
    (Categorical Microcosm), Book V (Categorical Macrocosm), the calibration
    cascade anchored by ι_τ ≈ 0.341304, the 67-prediction catalogue, and the
    N1–N30 falsification pack. Reviewers auditing the EW-sector predictions,
    the CMB-S4 r ≈ 0.0136 falsifier, or the cosmological-constant bridge should
    read Red-team FAQ #11 for the precision-tier honesty discussion before
    treating any single tier badge as endorsement of measurement-precision
    agreement.
