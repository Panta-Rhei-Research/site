# Prior-art clusters for the Panta Rhei Research Program.
#
# Each cluster groups bibliography references that share a domain pressure
# the program engages. The cluster body documents what kind of work belongs,
# the strongest representative references, and the program-side construction
# steps and structural challenges the cluster bears on. The Deep Comparison
# briefing at /agenda/kernel-model-reality/related-approaches/deep-comparison/
# carries fuller editorial comparisons for selected approach families; the
# clusters here are the structured-data backbone the site projects from.
#
# References are stable bibliography bib_keys curated by domain importance
# and by citation density inside the corpus (cited_in counts). They are
# representative, not exhaustive — the full per-domain reference set is
# enumerable via the Bibliography browse surface.
#
# Schema: corpus/schema/prior-art-cluster.schema.json
# Validator: corpus/scripts/validate_prior_art_clusters.py
# Sync target: site/_data/bibliography/prior-art-clusters.yml
clusters:
- cluster_id: pa000001
  cluster_key: category_theory
  title: Category Theory
  summary: Bibliography domain cluster for Category Theory.
  description: >-
    Foundational and modern category-theoretic literature: classical category
    theory, elementary topos theory (ETCS), enriched category theory, type-
    theoretic foundations including Homotopy Type Theory, and category-theoretic
    treatments of self-reference and diagonal arguments. The Panta Rhei kernel
    inherits from this lineage — the K0–K6 axioms, the progression operator, the
    Yoneda enrichment ladder, and the τ-topos with its four-valued internal logic
    all sit in dialogue with this body of work. Reviewers comparing the framework
    against ETCS, HoTT/UF, or topos-theoretic physics programs (Isham, Döring,
    Schreiber) should start here; the Deep Comparison briefing covers the closest
    approach families in narrative form.
  domains:
  - category_theory
  reference_count: 60
  references:
