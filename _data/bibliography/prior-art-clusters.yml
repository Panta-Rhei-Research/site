- cluster_id: pa000004
  cluster_key: life_and_biology
  title: Life and Biology
  summary: Bibliography domain cluster for Life and Biology.
  description: >-
    Origin-of-life, consciousness, and biological-systems literature spanning
    Aristotle's De Anima through modern theories of consciousness (Baars Global
    Workspace, Chalmers' hard problem framing, Tononi's IIT, Dehaene's neural
    correlates). The cluster supports Book VI (life as self-decoding distinctions)
    and Book VII (consciousness as global section) and is engaged by the LIFE-SC
    challenges around abiogenesis, homochirality, the genetic code, and the
    cognition / consciousness boundary. Reviewers should note the program's
    explicit "partially addressed" status on the hard problem (see Red-team FAQ
    #13) — the cluster represents the prior art the program is in dialogue with,
    not work the program claims to have superseded.
