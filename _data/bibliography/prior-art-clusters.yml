- cluster_id: pa000006
  cluster_key: number_theory_and_analysis
  title: Number Theory and Analysis
  summary: Bibliography domain cluster for Number Theory and Analysis.
  description: >-
    The analytic-number-theory and elliptic-curves literature engaged by
    Book III's spectral and L-function machinery: Silverman on elliptic curves,
    Bump and Diamond–Shurman on automorphic forms and modular forms, Iwaniec–
    Kowalski on analytic methods, Edwards and Titchmarsh on the Riemann zeta
    function, and the BCDT modularity literature. The Book III custom axiom
    `grand_grh_adelic` is explicitly conditional on this body of work
    (compute-then-axiomatize pattern; see /verify/custom-axioms/). Reviewers
    auditing the program's GRH-adjacent claims and the Master Schema bridge
    should start with Bump, Iwaniec–Kowalski, and the canonical RH literature
    cited in Book III.
