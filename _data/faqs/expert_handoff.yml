  display:
    compact_label: Philosopher?
    show_on_faq_index: true
  suggested_expert_types:
  - Philosopher of science
  - Metaphysician
  - Philosopher of mind
  - Philosopher of mathematics
  - Ethics specialist
  suggested_first_question: Are interpretive claims explanatory rather than merely definitional?
- id: FAQ-EH-007
  slug: what-should-a-life-scientist-inspect
  layer: 4
  priority: 7
  audience:
