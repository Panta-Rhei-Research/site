- id: FAQ-EH-010
  slug: what-should-an-editor-ask-an-expert
  layer: 4
  priority: 10
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - editor_checklist
  - expert_interview
  - responsible_coverage
  question: What should an editor ask an outside expert?
  short_answer: 'Ask a bounded question: “Does this specific claim layer hold up, and what would count as a failure?”'
  long_answer: 'Editors should avoid broad reaction quotes. A good question names the artifact, layer, and failure condition:
    formal build, hinge theorem, prediction independence, prior-art novelty, interpretive coherence, or impact translation.'
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
  - title: How to Verify by Role
    url: https://panta-rhei.site/verify/how-to-verify-by-role/
