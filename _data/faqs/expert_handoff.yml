- id: FAQ-EH-004
  slug: what-should-a-formal-methods-expert-inspect
  layer: 4
  priority: 4
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - formal_methods
  - lean
  - reproducibility
  - tcb
  - expert_routing
  question: What should a formal-methods expert inspect first?
  short_answer: Reproduce the pinned TauLib build, scan for `sorry` and `axiom`, inspect the custom axiom inventory, and run
    `#print axioms` on selected hinge theorems.
  long_answer: Formal-methods review begins with source, manifest, trust budget, and audit commands. The goal is to determine
    whether the formalization claims reproduce and whether public prose accurately describes the Lean code.
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
