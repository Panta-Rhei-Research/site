  suggested_expert_types:
  - Any domain expert matched to the claim layer
  suggested_first_question: Which specific artifact did you inspect, and what is your confidence about that layer only?
- id: FAQ-EH-011
  slug: what-is-a-good-expert-answer
  layer: 4
  priority: 11
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - expert_interview
  - evaluation_quality
  - responsible_coverage
  question: What counts as a useful expert answer?
  short_answer: A useful answer names the layer inspected, the artifact checked, the specific objection or support, and the
    remaining uncertainty.
  long_answer: A useful answer is bounded and traceable. It identifies exactly what was inspected and what the comment supports
    or challenges. Praise or dismissal without artifact and layer is weak evidence.
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
