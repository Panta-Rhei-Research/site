  question: What should a life scientist or theoretical biologist inspect first?
  short_answer: Inspect whether life-sector claims connect to observable biological constraints rather than becoming true
    only inside τ vocabulary.
  long_answer: Life-science review should ask whether the framework explains biological structure or merely redescribes it.
    The reviewer should test bridgeability to theoretical biology, origin-of-life, astrobiology, and systems biology criteria.
