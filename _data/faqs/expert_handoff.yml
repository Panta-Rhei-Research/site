  - title: Prior-Art Comparisons
    url: https://panta-rhei.site/framework/prior-art/
  display:
    compact_label: Prior art?
    show_on_faq_index: true
  suggested_expert_types:
  - Quaternionic/Clifford analysis specialist
  - Hilbert-Pólya/Connes/Berry-Keating specialist
  - Particle-theory prior-art specialist
  - Formal biology/consciousness specialist
  - Modified gravity specialist
  suggested_first_question: After translation into closest prior vocabulary, is there substantive novelty or relabeling?
- id: FAQ-EH-006
  slug: what-should-a-philosopher-inspect
  layer: 4
  priority: 6
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - philosophy
  - metaphysics
  - theory_of_reality
  - interpretation
  - expert_routing
  question: What should a philosopher of science, mind, or metaphysics inspect first?
  short_answer: Inspect whether the framework earns its language, keeps status levels separate, and avoids turning definitions
    into disguised conclusions.
  long_answer: 'Philosophical review asks conceptual discipline: are formal, empirical, bridge, interpretive, and ontic claims
    separated? Are terms such as reality, observer, life, mind, and value earned rather than smuggled in?'
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
  - title: How to Verify by Role
    url: https://panta-rhei.site/verify/how-to-verify-by-role/
