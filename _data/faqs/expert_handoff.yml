- id: FAQ-EH-005
  slug: what-should-a-prior-art-specialist-inspect
  layer: 4
  priority: 5
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - prior_art
  - novelty
  - overlap
  - relabeling
  - expert_routing
  question: What should a prior-art specialist inspect first?
  short_answer: Test whether claimed differences survive translation into neighboring vocabularies, especially τ-holomorphy,
    spectral ζ, generation physics, life theories, and no-dark-sector programs.
  long_answer: Prior-art review asks whether novelty survives direct comparison. Compare τ claims against established neighboring
    programs and test for relabeling, rediscovery, or genuine structural difference.
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
