- id: FAQ-EH-001
  slug: which-expert-should-i-call-first
  layer: 4
  priority: 1
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - expert_routing
  - review_strategy
  - first_contact
  question: Which expert should I call first?
  short_answer: It depends on the claim. For TauLib, call a formal-methods expert; for kernel hinges, a mathematician; for
    numerical predictions, a physicist; for scope, a philosopher of science.
  long_answer: 'No single expert should be asked to judge the whole program at once. Match the expert to the claim layer:
    formal build, mathematical hinge, physics bridge, prior art, interpretive scope, life-sector adequacy, or impact translation.'
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
  - title: How to Verify by Role
    url: https://panta-rhei.site/verify/how-to-verify-by-role/
  - title: Domain Verification
    url: https://panta-rhei.site/verify/domain-verification/
  related_pages:
