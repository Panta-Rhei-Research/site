- id: FAQ-EH-016
  slug: what-expert-review-would-change-the-status
  layer: 4
  priority: 16
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - status_change
  - expert_review
  - validation
  - scrutiny
  question: What kind of expert review would materially change the status?
  short_answer: A review changes status only if it is specific, documented, artifact-linked, and bounded to a claim layer
    or dependency chain.
  long_answer: Informal praise or dismissal is not enough. A status-changing review identifies the artifact, specialist competence,
    exact claim layer, method of inspection, and resulting judgment; it should be citable and incorporable into status labels,
    errata, or Release Manifest notes.
