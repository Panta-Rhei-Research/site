    url: https://panta-rhei.site/media/review-kit/
  - title: How to Verify by Role
    url: https://panta-rhei.site/verify/how-to-verify-by-role/
  display:
    compact_label: Which expert first?
    show_on_faq_index: true
  suggested_expert_types:
  - Lean/formal-methods reviewer
  - Mathematician
  - Physicist
  - Philosopher of science
  - Prior-art specialist
  suggested_first_question: Which bounded claim layer are you competent to judge?
- id: FAQ-EH-002
  slug: what-should-a-mathematician-inspect
  layer: 4
  priority: 2
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - mathematics
  - expert_routing
  - foundational_hinges
  - proof_review
  question: What should a mathematician inspect first?
  short_answer: 'Start with the Foundational Hinges route and the three load-bearing clusters: kernel categoricity/rigidity,
    the Central Theorem, and the τ-internal spectral/RH route.'
  long_answer: The mathematical first pass should inspect Books I–III through the hinge routes, not read the entire series.
    The review asks whether the mathematical spine is nontrivial, correctly scoped, and dependent only on disclosed assumptions.
  source_pages:
  - title: Review Kit
    url: https://panta-rhei.site/media/review-kit/
