- id: FAQ-EH-008
  slug: what-should-an-impact-or-public-good-reviewer-inspect
  layer: 4
  priority: 8
  audience:
  - journalist
  - editor
  - fact_checker
  - reviewer
  - institution
  category:
  - impact
  - public_good
  - translation
  - governance
  - expert_routing
  question: What should an impact or public-good reviewer inspect first?
  short_answer: 'Inspect the dependency chain: upstream Results, translation assumptions, domain validation, benchmark metrics,
    governance risks, and what is not yet deployment-ready.'
  long_answer: Impact claims are conditional downstream scenarios, not product claims. Reviewers should trace the chain from
    upstream τ result to domain translation to pilot benchmark to governance condition.
  source_pages:
