  - title: Foundational Hinges
    url: https://panta-rhei.site/corpus/foundational-hinges/
  display:
    compact_label: Mathematician?
    show_on_faq_index: true
  suggested_expert_types:
  - Category theorist
  - Model theorist/logician
  - Analytic number theorist
  - Operator theorist
  - Algebraic geometer
  suggested_first_question: Are the hinge claims meaningful and strong enough under disclosed assumptions?
