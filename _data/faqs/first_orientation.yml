  question: What are Results, and are they the same as accepted scientific conclusions?
  short_answer: Results are status-marked consequence surfaces of the built Corpus. They are not the same as external verification
    or scientific acceptance.
  long_answer: 'Results show what the framework currently says follows across mathematics, physics, life, and metaphysics.
    They must be read with status markers: internal stance, verification route, and external-acceptance boundary are separate.
    A result can be internally addressed without being externally accepted.'
