- id: FAQ-OR-008
  slug: what-happens-if-a-hinge-fails
  layer: 1
  priority: 8
  audience:
  - journalist
  - editor
  - first_time_reader
  - skeptic
  - reviewer
  category:
  - falsification
  - failure_modes
  - red_team
  - hinges
  question: What happens if a key hinge fails?
  short_answer: Then the downstream claims depending on that hinge weaken or fail. The site should be read as a dependency
    structure, not as a list of independent claims.
  long_answer: Claims are routed through construction steps, hinge pages, Registry entries, TauLib modules, and Verify surfaces.
    If a hinge fails, the relevant downstream claims need to be relabeled, weakened, repaired, or withdrawn according to dependency.
