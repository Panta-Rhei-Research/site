  question: What is the Corpus?
  short_answer: 'The Corpus is the construction body of the theory: definitions, derivations, monograph exposition, registry
    objects, TauLib projections, and dependency relations.'
  long_answer: The Corpus is where the theory is built rather than merely announced. It is not identical to the books, the
    Registry, or TauLib; those are projections of the Corpus. A reviewer asks there what was constructed, in what order, from
    what earlier obligations, and with which dependency anchors.
