  question: What is the master constant, and why does it matter?
  short_answer: The master constant is the scalar value ι_τ = 2/(π + e) used by the numerical physics surface; the site treats
    it as a central review target, not a rhetorical shortcut.
  long_answer: The master constant is one of the first red-team questions. The physics surface depends on whether ι_τ is genuinely
    forced by the kernel/scalar-readout construction or effectively fitted. The site routes this through a research paper,
    Corpus H3 page, Step 2, Registry anchors, and TauLib evidence.
