  question: Is the master constant fitted to data?
  short_answer: That is the central red-team question. The site claims a structural derivation route, but downstream numerical
    claims should not be weighted until this hinge is inspected.
  long_answer: The first question is not whether downstream numbers are impressive. It is whether ι_τ is fixed before physical
    calibration enters. If the derivation fails, the downstream zero-parameter physics claim weakens substantially.
