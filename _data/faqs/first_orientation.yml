  question: Where should I start if I am not a specialist?
  short_answer: Start with Discover. It is the guided first-contact route and explains how the site’s Program, Agenda, Corpus,
    Results, Verify, Impact, and Publications lanes fit together.
  long_answer: A non-specialist should begin with orientation rather than claims. Discover explains the site structure and
    routes readers into the construction body, consequence surfaces, and inspection routes. The safest reading order is orientation
    first, obligations second, construction third, results fourth, verification always.
