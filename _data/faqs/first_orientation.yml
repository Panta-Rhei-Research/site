- id: FAQ-OR-011
  slug: where-are-failure-paths
  layer: 1
  priority: 11
  audience:
  - journalist
  - editor
  - first_time_reader
  - skeptic
  - reviewer
  category:
  - falsification
  - predictions
  - empirical_accountability
  question: Where are the failure paths?
  short_answer: Failure paths are exposed through prediction timing, falsification pack, hinge pages, Release Manifest, errata,
    and Verify routes.
  long_answer: Failure is not one thing. Mathematical hinges can fail; formal builds can fail; bridge claims can fail; empirical
    predictions can fail; public-good translations can fail. The site should route each kind of failure to the right inspection
    surface.
