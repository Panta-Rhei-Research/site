- id: FAQ-OR-009
  slug: what-does-taulib-prove
  layer: 1
  priority: 9
  audience:
  - journalist
  - editor
  - first_time_reader
  - skeptic
  - reviewer
  category:
  - taulib
  - lean
  - formalization
  - verification
  question: What does TauLib / Lean actually prove?
  short_answer: TauLib proves that encoded formal statements compile under the pinned Lean environment. It does not by itself
    prove empirical truth, bridge adequacy, or scientific acceptance.
  long_answer: TauLib is the Lean formalization projection. If a theorem is encoded and compiles, Lean checks that theorem
    relative to the formal environment, trusted computing base, and disclosed assumptions. Bridge claims and empirical interpretations
    remain separate burdens.
  source_pages:
