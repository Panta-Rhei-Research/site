  question: What should I read next if I have ten more minutes?
  short_answer: Read Discover, then Verify, then either the Master Constant hinge or Results overview, depending on whether
    your next question is credibility or substance.
  long_answer: 'A practical route is: Discover for structure; Verify for inspection boundaries; Master Constant for physics
    skepticism; Results for consequence surfaces; Corpus/Construction Spine for construction burden; Journalist FAQ for responsible
    coverage. Do not start by reading all seven monographs.'
