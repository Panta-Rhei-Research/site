- id: FAQ-OR-010
  slug: what-does-verification-not-settle
  layer: 1
  priority: 10
  audience:
  - journalist
  - editor
  - first_time_reader
  - skeptic
  - reviewer
  category:
  - verification
  - epistemic_boundaries
  - bridge_claims
  question: What does verification not settle?
  short_answer: Verification does not settle empirical truth, semantic interpretation, bridge adequacy, domain validity, public-good
    relevance, or external scientific acceptance.
  long_answer: Formal checking can certify encoded formal claims; prediction surfaces can expose commitments; falsification
    packs can identify failure paths. None of those alone establishes that a mathematical construction describes the physical
    world or that a public-good application is ready.
