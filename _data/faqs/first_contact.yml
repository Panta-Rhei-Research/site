  question: Who is behind it?
  short_answer: The program is independently authored and self-funded by Dr. Thorsten Fuchs and Anna-Sophie Fuchs; the site
    states that there is no institutional funder, grant sponsor, or corporate backer.
  long_answer: Panta Rhei is presented as an independent research program rather than an institutionally funded project. This
