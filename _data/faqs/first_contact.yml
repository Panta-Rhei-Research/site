- id: FAQ-FC-003
  slug: is-it-peer-reviewed
  layer: 0
  priority: 3
  audience: *id001
  category:
  - peer_review
  - external_validation
  - scrutiny
  question: Is it peer-reviewed?
  short_answer: Not yet by traditional journals. The work is public and open for structured scrutiny through review routes,
    assessment protocols, formalization surfaces, and citable artifacts.
  long_answer: 'The program is independently published and does not claim traditional peer review as completed validation.
    It exposes a public review architecture: TauLib, Release Manifest, assessment protocols, role-specific review routes,
    Reviewer/Media Kit surfaces, and correction channels. These are preparation for review, not a substitute for review.'
