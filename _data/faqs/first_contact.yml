  question: What is this, in one sentence?
  short_answer: Panta Rhei is an independent open research program published as a public research observatory for inspecting
    a proposed coherent theory of reality.
  long_answer: 'Panta Rhei is not a single paper, a blog, or a software project. It is a public research observatory around
    a structured research program: Discover orients, Program defines scope, Agenda states obligations, Corpus carries construction,
    Results reports consequence surfaces, Verify exposes inspection routes, Impact maps conditional relevance, and Publications
    provides citable artifacts.'
