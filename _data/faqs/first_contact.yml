- id: FAQ-FC-007
  slug: what-should-i-believe-after-five-minutes
  layer: 0
  priority: 7
  audience:
  - journalist
  - editor
  - first_time_reader
  - skeptic
  - expert
  category:
  - epistemic_posture
  - inspection
  - belief
  - scrutiny
  question: What should I believe after reading the site for five minutes?
  short_answer: You should not yet believe the scientific claims. You should believe only that the work is public, structured,
    inspectable, and serious enough to route into expert scrutiny.
  long_answer: 'After five minutes, the appropriate conclusion is not acceptance of the framework. The appropriate conclusion
    is that the public artifact exposes enough structure to deserve inspection: Program, Agenda, Corpus, Results, Verify,
    Release Manifest, TauLib, prediction/falsification surfaces, errata, and reviewer/journalist routes. Whether the claims
    are correct remains a separate expert-review question.'
