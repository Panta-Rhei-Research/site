- id: FAQ-FC-006
  slug: what-is-the-safest-headline-angle
  layer: 0
  priority: 6
  audience:
  - journalist
  - editor
  - media
  category:
  - media_framing
  - responsible_coverage
  - first_story
  question: What is the shortest safe headline angle?
  short_answer: 'The safest first angle is: “What should a serious theory of reality have to expose before asking for belief?”'
  long_answer: The responsible first story is not that the claims are validated. It is that an unusually ambitious independent
    research program has exposed obligations, construction spine, status labels, formalization, falsification paths, release
    manifests, errata, and review routes before asking for belief.
  source_pages:
