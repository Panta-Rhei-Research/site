- id: FAQ-FC-002
  slug: is-this-claiming-to-be-proven
  layer: 0
  priority: 2
  audience: *id001
  category:
  - proof_status
  - epistemic_status
  - inspection
  question: Is this claiming to be proven?
  short_answer: No. The public claim is that the work is structured, inspectable, and review-worthy; correctness still requires
    expert review and domain validation.
  long_answer: The site separates inspection architecture from validation. TauLib can check encoded formal claims, but Lean
    compilation does not prove empirical truth, bridge adequacy, semantic interpretation, public-good relevance, or external
    scientific acceptance. The first public claim is inspectability, not acceptance.
  source_pages:
