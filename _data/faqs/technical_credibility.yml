- id: FAQ-TC-002
  slug: does-taulib-prove-the-physical-claims
  layer: 3
  priority: 2
  audience: *id001
  category:
  - verification_boundary
  - physics
  - bridge_claims
  - empirical_truth
  question: Does TauLib prove the physical claims?
  short_answer: No. TauLib verifies formal obligations where encoded; it does not by itself prove empirical truth, bridge
    adequacy, semantic correspondence, or external scientific acceptance.
  long_answer: Lean can check encoded derivations. It cannot by compilation alone prove that a τ-internal object corresponds
    to a physical observable, that a measurement bridge is adequate, or that a numerical match validates the framework.
