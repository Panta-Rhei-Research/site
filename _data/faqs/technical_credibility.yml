- id: FAQ-TC-011
  slug: what-is-native-decide
  layer: 3
  priority: 11
  audience: *id001
  category:
  - native_decide
  - tcb
  - finite_computation
  - lean
  question: What is `native_decide`, and why is it a trust issue?
  short_answer: '`native_decide` proves decidable propositions by native computation; it is powerful, but it extends the trusted
    base beyond purely kernel-reduced proof terms.'
  long_answer: '`native_decide` is useful for finite computations, but it depends on native compilation/evaluation. The site
    should treat it as a named trust-budget extension, not hidden magic.'
