  question: What does “machine-checked in Lean” mean here?
  short_answer: It means encoded formal statements compile under the pinned Lean environment, relative to Lean’s trusted kernel,
    disclosed assumptions, and current TauLib snapshot.
  long_answer: Machine-checked does not mean every prose claim is verified. It means the Lean-encoded theorem or obligation
    is accepted by the proof checker under the disclosed environment and trust budget.
