- id: FAQ-TC-008
  slug: what-is-compute-then-axiomatize
  layer: 3
  priority: 8
  audience: *id001
  category:
  - custom_axioms
  - finite_checks
  - conjectural_status
  - audit
  question: What does “compute-then-axiomatize” mean?
  short_answer: It means a universal claim is finite-checked over an explicit computable envelope, but the unbounded universal
    step is still declared as an axiom rather than proved.
  long_answer: This pattern is explicit debt, not proof. It is acceptable only if named, bounded, reproducible, load-bearing,
    and reflected in downstream scope labels.
