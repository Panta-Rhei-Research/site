- id: FAQ-TC-004
  slug: what-is-a-sorry
  layer: 3
  priority: 4
  audience: *id001
  category:
  - lean
  - sorry
  - proof_gaps
  - formalization
  question: What is a `sorry`, and why does 0 `sorry` matter?
  short_answer: In Lean, `sorry` is a placeholder for an unfinished proof. A 0-sorry release means no explicit unfinished-proof
    placeholders remain in the pinned TauLib source.
  long_answer: A `sorry` can temporarily accept a theorem without proof. A 0-sorry release is meaningful formalization hygiene,
    while still not proving bridge adequacy or empirical truth.
  source_pages:
