  question: What is the difference between the Registry and TauLib?
  short_answer: The Registry is the object/dependency map of the Corpus; TauLib is the Lean formalization projection of selected
    formal content.
  long_answer: A registry object is a stable public ID for a Corpus item. A TauLib module is a Lean source file. The meaningful
