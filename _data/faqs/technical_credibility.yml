- id: FAQ-TC-005
  slug: does-zero-sorry-mean-the-theory-is-true
  layer: 3
  priority: 5
  audience: *id001
  category:
  - proof_boundaries
  - sorry
  - verification_boundary
  - hype_control
  question: Does 0 `sorry` mean the theory is true?
  short_answer: No. It means the formalized Lean proofs have no explicit unfinished-proof placeholders; it does not settle
    bridge, semantic, empirical, or external-review questions.
  long_answer: A 0-sorry Lean development is stronger than one with placeholder proofs, but it is not a truth certificate
    for the whole research program. The encoded statements, correspondence to prose, bridge claims, and domain claims remain
    separate burdens.
