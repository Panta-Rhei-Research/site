- id: FAQ-TC-018
  slug: what-remains-bridge-pending
  layer: 3
  priority: 18
  audience: *id001
  category:
  - bridge_claims
  - verification_boundary
  - domain_validation
  - external_review
  question: What remains bridge-pending?
  short_answer: Any claim that transfers from τ-internal formal structure to standard mathematics, physics, biology, metaphysics,
    measurement, or public impact needs a separate bridge check.
  long_answer: Bridge adequacy asks whether a τ-internal construction legitimately transfers to the external target. The site
    should keep internal proof, bridge claim, and domain validation visibly separate.
