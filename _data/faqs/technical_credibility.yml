  slug: what-is-print-axioms
  layer: 3
  priority: 9
  audience: *id001
  category:
  - lean
  - axioms
  - audit
  - reproducibility
  question: What is `#print axioms`, and why does it matter?
  short_answer: '`#print axioms` is a Lean audit command that shows which axioms a declaration depends on, including custom
    axioms or `sorryAx` where present.'
  long_answer: It helps distinguish theorem statements that are fully proven under the disclosed base from statements that
    depend on classical axioms, custom axioms, native computation trust, or placeholder proof artifacts.
