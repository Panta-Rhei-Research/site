- id: FAQ-TC-010
  slug: what-is-the-trusted-computing-base
  layer: 3
  priority: 10
  audience: *id001
  category:
  - tcb
  - lean
  - trust_budget
  - formalization
  question: What is the trusted computing base?
  short_answer: 'The trusted computing base is the underlying machinery a Lean proof depends on: Lean’s kernel, standard axioms,
    and any disclosed extensions such as `native_decide`.'
  long_answer: No proof assistant verifies itself from nothing. The question is whether the trust base is disclosed, bounded,
    and auditable. TauLib’s TCB page names the Lean baseline and native computation costs.
  source_pages:
