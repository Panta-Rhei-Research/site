- id: FAQ-TC-020
  slug: what-would-be-a-serious-formalization-failure
  layer: 3
  priority: 20
  audience: *id001
  category:
  - failure_modes
  - reproducibility
  - formalization
  - audit
  question: What would count as a serious formalization failure?
  short_answer: A failed pinned build, unexpected `sorry`, undisclosed custom axiom, broken dependency trace, or mismatch
    between formal theorem and public prose would all be serious failures.
  long_answer: Such failures may require correction, retraction, relabeling, or narrowing. They do not all necessarily destroy
    the entire program, but they must update status labels and public artifacts.
