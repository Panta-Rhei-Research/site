  question: How do I cite a specific result, paper, or registry object?
  short_answer: Cite books and papers through DOI/citation pages, cite results by stable URL and status label, and cite registry
    objects by stable object ID and permalink.
  long_answer: Use the publication artifact for citable works, stable Result URLs for claims, Registry IDs for atomic objects,
    and the Release Manifest/TauLib for formalization claims.
