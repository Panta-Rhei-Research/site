- id: FAQ-JD-010
  slug: what-should-an-editor-ask-before-assigning
  layer: 2
  priority: 10
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - editor_checklist
  - responsible_coverage
  - review
  question: What should an editor ask before assigning a story?
  short_answer: Ask whether the piece is about inspection architecture or validated science, what claims are being checked,
    which experts will be called, and which status labels must be preserved.
  long_answer: 'A responsible assignment picks a bounded path: inspection architecture, master constant, TauLib formalization,
    prediction timing, falsification surface, or a domain-specific claim. Avoid a broad “new theory proves X” pitch.'
  source_pages:
