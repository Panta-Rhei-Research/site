- id: FAQ-JD-017
  slug: what-if-i-find-an-error
  layer: 2
  priority: 17
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - corrections
  - errata
  - accountability
  - engagement
  question: What if I find an error?
  short_answer: Report it. Corrections, errata, and bounded critique are part of the research architecture, not an embarrassment.
  long_answer: Errors may include broken proofs, stale numerical values, wrong scope labels, citation issues, broken links,
    or misleading framing. Report before publication where possible and describe unresolved discrepancies clearly.
  source_pages:
