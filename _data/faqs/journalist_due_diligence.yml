- id: FAQ-JD-014
  slug: how-should-i-cover-impact-claims
  layer: 2
  priority: 14
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - impact
  - public_good
  - translation
  - responsible_coverage
  question: How should I cover public-good or impact claims?
  short_answer: Cover them as conditional impact pathways, not as deployed products, institutional adoption, or proven applications.
  long_answer: Impact pages map what could matter if upstream Results survive review, translation, and uptake. Coverage should
    name upstream dependencies, translation assumptions, required domain validation, and governance risks.
  source_pages:
