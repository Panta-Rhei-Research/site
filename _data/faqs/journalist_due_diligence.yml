- id: FAQ-JD-011
  slug: which-experts-should-i-call
  layer: 2
  priority: 11
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - expert_handoff
  - review
  - domain_validation
  question: Which experts should I call first?
  short_answer: Call a formal-methods reviewer for TauLib, a mathematician for kernel hinges, a physicist for prediction bridges,
    and a philosopher of science for scope and framing.
  long_answer: Match experts to claim layers. Formal build, mathematical hinge, physics bridge, prior art, philosophical interpretation,
    life-sector adequacy, and impact translation require different reviewers.
