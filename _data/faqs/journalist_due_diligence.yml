- id: FAQ-JD-018
  slug: what-if-experts-disagree
  layer: 2
  priority: 18
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - expert_disagreement
  - responsible_coverage
  - uncertainty
  question: What if outside experts disagree?
  short_answer: 'Report the disagreement by claim layer: form, formalization, bridge adequacy, prior art, empirical prediction,
    or interpretation.'
  long_answer: A useful article does not flatten disagreement into one yes/no verdict. It identifies the layer being disputed,
    the artifact inspected, the expert domain, and remaining uncertainty.
