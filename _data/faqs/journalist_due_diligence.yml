- id: FAQ-JD-007
  slug: what-should-i-link-first
  layer: 2
  priority: 7
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - linking
  - citation
  - source_artifacts
  question: What should I link first?
  short_answer: Link the Journalist FAQ or Media Kit for framing, then Verify or the Release Manifest for inspection status,
    and only then route readers to specific Results or papers.
  long_answer: Do not link only a striking result without status context. A good link stack starts with framing and verification,
    then points to the specific Corpus, Result, paper, Registry, or TauLib artifact.
