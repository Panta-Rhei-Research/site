  - conflicts
  - disclosure
  - independence
  question: What funding or conflicts should I disclose?
  short_answer: Disclose that the program is independently authored and self-funded, with no institutional funder, grant sponsor,
    or corporate backer stated on the site.
  long_answer: Report funding status neutrally. Independence may explain the publication route, but it is not evidence that
    the claims are correct.
