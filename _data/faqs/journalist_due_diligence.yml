- id: FAQ-JD-006
  slug: how-should-i-describe-the-work
  layer: 2
  priority: 6
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - description
  - boilerplate
  - naming
  question: How should I describe the work accurately?
  short_answer: 'Use: “Panta Rhei is an independent open research program dedicated to building a coherent theory of reality,
    published as an inspectable research observatory.”'
  long_answer: This phrasing identifies the scope, independence, public-release form, and inspection posture without claiming
    validation. Use Panta Rhei Research Program for the program and Category τ for the framework where appropriate.
  source_pages:
