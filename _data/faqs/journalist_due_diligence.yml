- id: FAQ-JD-003
  slug: what-should-i-avoid-writing
  layer: 2
  priority: 3
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - responsible_coverage
  - hype_control
  - avoid
  question: What should I avoid writing?
  short_answer: Do not write that the framework is proven, peer-reviewed, externally accepted, or that Lean proves the physical
    claims.
  long_answer: Avoid collapsing status boundaries. Do not present internal results as externally accepted conclusions, do
    not call it a theory of everything, and do not treat Lean compilation as empirical truth.
  source_pages:
