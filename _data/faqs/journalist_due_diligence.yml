- id: FAQ-JD-012
  slug: what-should-i-ask-experts
  layer: 2
  priority: 12
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - expert_handoff
  - red_team
  - interview_questions
  question: What should I ask outside experts?
  short_answer: Ask whether the artifact is inspectable, whether the specific claim is well-typed, whether the derivation
    is forced, whether prior art overlaps, and what would falsify it.
  long_answer: Do not ask an expert to judge the entire program in one quote. Ask them which artifact they inspected, what
    layer they can judge, and what would change their assessment.
  source_pages:
