  question: What is the responsible first story?
  short_answer: 'The responsible first story is the inspection architecture: what a serious high-scope research program exposes
    before asking anyone to believe it.'
  long_answer: The first story should be architectural and epistemic, not triumphalist. The site is a case study in obligations,
    Corpus, Results, TauLib, Release Manifest, predictions, falsification, errata, and assessment protocols.
