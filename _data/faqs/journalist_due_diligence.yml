- id: FAQ-JD-013
  slug: how-should-i-cover-predictions
  layer: 2
  priority: 13
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - predictions
  - falsification
  - physics
  - responsible_coverage
  question: How should I cover predictions and falsification claims?
  short_answer: Cover them as public accountability commitments, not as validated confirmations. Preserve timing categories,
    precision tiers, and failure conditions.
  long_answer: Some prediction records are post-dictions, some tension-side commitments, and some forward tests. A responsible
    piece links prediction timing and falsification surfaces and does not imply numerical agreement validates the whole framework.
  source_pages:
  - title: Journalist FAQ
    url: https://panta-rhei.site/media/journalist-faq/
