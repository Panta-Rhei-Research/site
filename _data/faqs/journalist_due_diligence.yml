- id: FAQ-JD-001
  slug: can-i-write-before-expert-review
  layer: 2
  priority: 1
  audience:
  - journalist
  - editor
  - fact_checker
  - public_communicator
  category:
  - responsible_coverage
  - peer_review
  - framing
  question: Can a journalist write about this before expert review?
  short_answer: Yes, if the story is framed around inspectability, open-research infrastructure, and the public burden the
    program accepts — not around validated scientific truth.
  long_answer: Coverage before expert review is responsible only if status is clear. The story should be about public research
    form and inspection surfaces, not about acceptance of the scientific claims.
