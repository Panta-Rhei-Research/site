  question: Are external institutions endorsing Panta Rhei?
  short_answer: No. External organizations and references are cited as context, standards, or background, not as endorsement,
    validation, review, or acceptance.
  long_answer: Citations to open-science, standards, philosophy, repository, or reporting resources are contextual. They must
    not be converted into institutional endorsement.
